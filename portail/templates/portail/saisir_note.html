<!DOCTYPE html>
<html lang="fr">

<head>

<title>Saisie Note - IUHEG</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<div class="card shadow p-4">


<h3>
📝 Saisie de note
</h3>

<hr>


<p>
<strong>Étudiant :</strong>
{{ etudiant }}
</p>


<p>
<strong>Cours :</strong>
{{ cours }}
</p>


<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label>
Note Contrôle Continu (CC)
</label>

{{ form.note_cc }}

</div>



<div class="mb-3">

<label>
Note Examen
</label>

{{ form.note_examen }}

</div>



<button class="btn btn-success">

💾 Enregistrer

</button>


<a href="{% url 'liste_etudiants_cours' cours.id %}"
class="btn btn-secondary">

Retour

</a>


</form>


</div>


</div>


</body>

</html>

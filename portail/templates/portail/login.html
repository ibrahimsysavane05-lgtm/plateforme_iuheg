{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Connexion - IUHEG</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;
}


.login-card{

    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.15);

}


.logo{

    width:90px;
    height:90px;
    border-radius:50%;
    display:block;
    margin:auto;

}


.titre{

    text-align:center;
    color:#1a3a6b;
    font-weight:bold;

}


.btn-login{

    background:#1a3a6b;
    color:white;

}


.btn-login:hover{

    background:#e07b00;
    color:white;

}

</style>

</head>


<body>


<div class="login-card">


<img src="{% static 'images/logo_iuheg_original.jpg' %}" 
class="logo">


<h3 class="titre mt-3">
Portail IUHEG
</h3>


<p class="text-center">
Connexion à votre espace
</p>



{% if messages %}

{% for message in messages %}

<div class="alert alert-danger">
{{ message }}
</div>

{% endfor %}

{% endif %}



<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Identifiant
</label>

<input 
type="text"
name="matricule"
class="form-control"
placeholder="Matricule ou identifiant"
required>

</div>



<div class="mb-3">

<label class="form-label">
Mot de passe
</label>


<input 
type="password"
name="password"
class="form-control"
placeholder="Mot de passe"
required>

</div>



<button 
type="submit"
class="btn btn-login w-100">

Se connecter

</button>


</form>


<div class="text-center mt-3">

<a href="/">
Retour à l'accueil

</a>

</div>


</div>


</body>

</html>

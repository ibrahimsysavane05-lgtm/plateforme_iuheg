{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Professeur — IUHEG</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, rgba(10,22,40,0.93), rgba(26,58,107,0.89)),
            url('/static/images/logo_iuheg_original.jpg') center/350px no-repeat fixed;
            min-height:100vh;
            padding:40px 20px;
        }

        .form-card {
            background:white;
            border-radius:20px;
            padding:40px;
            max-width:800px;
            margin:auto;
            box-shadow:0 20px 60px rgba(0,0,0,0.4);
        }

        .header {
            text-align:center;
            margin-bottom:30px;
        }

        .header img {
            height:90px;
            border-radius:50%;
        }

        h2 {
            color:#1a3a6b;
            font-weight:700;
        }

        .section-title {
            color:#1a3a6b;
            font-weight:700;
            border-left:4px solid #e07b00;
            padding-left:12px;
            margin:25px 0 15px;
        }

        .form-control, .form-select {
            border-radius:10px;
            padding:10px;
        }

        .btn-submit {
            background:#1a3a6b;
            color:white;
            width:100%;
            padding:14px;
            border-radius:10px;
            font-weight:bold;
            margin-top:20px;
        }

        .btn-submit:hover {
            background:#2d5aa0;
            color:white;
        }
    </style>

</head>

<body>

<div class="form-card">

<div class="header">

<img src="{% static 'images/logo_iuheg_original.jpg' %}">

<h2>Inscription Professeur</h2>

<p>
Institut Universitaire des Hautes Études de Guinée
</p>

</div>


<form method="POST">

{% csrf_token %}


<p class="section-title">
Informations personnelles
</p>


<div class="row g-3">

<div class="col-md-6">
<label>Nom</label>
<input class="form-control" name="nom" required>
</div>


<div class="col-md-6">
<label>Prénom</label>
<input class="form-control" name="prenom" required>
</div>


<div class="col-md-6">
<label>Sexe</label>

<select class="form-select" name="sexe">
<option value="M">Masculin</option>
<option value="F">Féminin</option>
</select>

</div>


<div class="col-md-6">
<label>Date de naissance</label>
<input type="date" class="form-control" name="date_naissance" required>
</div>


<div class="col-md-6">
<label>Lieu de naissance</label>
<input class="form-control" name="lieu_naissance" required>
</div>


<div class="col-md-6">
<label>Téléphone</label>
<input class="form-control" name="telephone" required>
</div>


<div class="col-md-6">
<label>Email</label>
<input type="email" class="form-control" name="email" required>
</div>


<div class="col-12">
<label>Adresse</label>
<textarea class="form-control" name="adresse"></textarea>
</div>


</div>



<p class="section-title">
Informations professionnelles
</p>


<div class="row g-3">


<div class="col-md-6">
<label>Spécialité</label>
<input class="form-control" name="specialite" required>
</div>


<div class="col-md-6">
<label>Grade</label>
<input class="form-control" name="grade" required>
</div>


<div class="col-md-6">
<label>Département</label>
<input class="form-control" name="departement" required>
</div>


<div class="col-md-6">
<label>Date de recrutement</label>
<input type="date" class="form-control" name="date_recrutement" required>
</div>


</div>



<p class="section-title">
Créer un compte
</p>


<div class="row g-3">


<div class="col-md-6">
<label>Mot de passe</label>
<input type="password" class="form-control" name="password" required>
</div>


<div class="col-md-6">
<label>Confirmation</label>
<input type="password" class="form-control" name="password2" required>
</div>


</div>


<button class="btn-submit">
Créer mon compte professeur
</button>


</form>


</div>

</body>
</html>
